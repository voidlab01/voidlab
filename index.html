    <script>
        // 토스트 알림 자동 닫힘 타이머
        let toastTimer = null;

        /**
         * 로고 이미지(./logo.jpg)가 로드되면 오프스크린 캔버스로 상단 좌·우 모서리 픽셀 색상을 추출하여
         * #cardHeader 배경색에 적용해 로고와 헤더 사이에 경계선이 전혀 보이지 않도록 맞춥니다.
         * @param {HTMLImageElement} imgEl - 로드 완료된 로고 이미지 요소
         */
        function syncHeaderBackground(imgEl) {
            try {
                const headerEl = document.getElementById('cardHeader');
                if (!headerEl || !imgEl || !imgEl.naturalWidth || !imgEl.naturalHeight) return;

                const width = imgEl.naturalWidth;
                const height = imgEl.naturalHeight;

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                if (!ctx) return;

                ctx.drawImage(imgEl, 0, 0, width, height);

                // 상단 좌·우 모서리 픽셀 샘플링 후 평균 RGB 계산
                const leftX = Math.min(2, width - 1);
                const rightX = Math.max(0, width - 3);
                const topY = Math.min(2, height - 1);

                const pLeft = ctx.getImageData(leftX, topY, 1, 1).data;
                const pRight = ctx.getImageData(rightX, topY, 1, 1).data;

                // 투명 배경이 아닌 경우에만 헤더 배경색 적용
                if (pLeft[3] > 20 && pRight[3] > 20) {
                    const r = Math.round((pLeft[0] + pRight[0]) / 2);
                    const g = Math.round((pLeft[1] + pRight[1]) / 2);
                    const b = Math.round((pLeft[2] + pRight[2]) / 2);

                    const toHex = (val) => val.toString(16).padStart(2, '0').toUpperCase();
                    headerEl.style.backgroundColor = `#${toHex(r)}${toHex(g)}${toHex(b)}`;
                }
            } catch (err) {
                // CORS 또는 로컬 파일 보안 정책으로 캔버스 읽기가 제한되면 기본 #D8D4CC 유지
                console.warn('로고 배경색 자동 추출을 건너뛰고 기본 #D8D4CC 컬러를 유지합니다.', err);
            }
        }

        /**
         * ./logo.jpg가 아직 없는 환경(독립 미리보기 등)에서 깨진 이미지 아이콘 대신
         * 미니멀한 타이포그래피 로고 폴백을 자연스럽게 표시합니다.
         */
        function showLogoFallback() {
            const logoImg = document.getElementById('logoImg');
            const fallbackEl = document.getElementById('logoTextFallback');
            if (logoImg) {
                logoImg.style.display = 'none';
            }
            if (fallbackEl) {
                fallbackEl.classList.remove('hidden');
                fallbackEl.classList.add('flex');
            }
        }

        /**
         * 하단 플로팅 토스트 알림 표시
         * @param {string} message - 표시할 메시지
         */
        function showToast(message) {
            const toastEl = document.getElementById('toast');
            if (!toastEl) return;

            toastEl.textContent = message;
            toastEl.classList.remove('opacity-0', 'translate-y-2');
            toastEl.classList.add('opacity-100', 'translate-y-0');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('opacity-100', 'translate-y-0');
                toastEl.classList.add('opacity-0', 'translate-y-2');
            }, 2400);
        }

        /**
         * 모바일 브라우저 및 iFrame 환경에서도 안정적으로 작동하는 클립보드 복사 함수
         * @param {string} text - 복사할 텍스트
         * @param {string} successMessage - 복사 완료 토스트 문구
         */
        function copyToClipboard(text, successMessage = '복사되었습니다') {
            try {
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = text;
                tempTextarea.setAttribute('readonly', '');
                tempTextarea.style.position = 'fixed';
                tempTextarea.style.top = '-9999px';
                tempTextarea.style.left = '-9999px';
                document.body.appendChild(tempTextarea);

                tempTextarea.select();
                tempTextarea.setSelectionRange(0, tempTextarea.value.length);

                const isCopied = document.execCommand('copy');
                document.body.removeChild(tempTextarea);

                if (isCopied) {
                    showToast(successMessage);
                } else {
                    showToast('복사에 실패했습니다. 직접 선택해 복사해 주세요.');
                }
            } catch (err) {
                console.error('클립보드 복사 오류:', err);
                showToast('복사에 실패했습니다. 직접 선택해 복사해 주세요.');
            }
        }

        /**
         * UTF-8 BOM 포함 vCard(.vcf) 파일을 생성해 스마트폰 연락처로 바로 저장할 수 있게 다운로드합니다.
         */
        function downloadVCard() {
            try {
                const vCardLines = [
                    'BEGIN:VCARD',
                    'VERSION:3.0',
                    'N;CHARSET=UTF-8:김;석민;;;',
                    'FN;CHARSET=UTF-8:김석민',
                    'ORG;CHARSET=UTF-8:VOID LAB (보이드랩)',
                    'TITLE;CHARSET=UTF-8:대표',
                    'TEL;TYPE=CELL:010-2882-8977',
                    'EMAIL;TYPE=INTERNET:voidlab01@naver.com',
                    'URL:https://blog.naver.com/voidlab_',
                    'NOTE;CHARSET=UTF-8:수도권 전 지역 시공·상담 / 카카오톡 오픈채팅: https://open.kakao.com/o/sOwPw83g',
                    'END:VCARD'
                ];

                // iOS/Android 한글 깨짐 방지를 위한 UTF-8 BOM 추가
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const blob = new Blob([bom, vCardLines.join('\r\n')], {
                    type: 'text/vcard;charset=utf-8'
                });

                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = objectUrl;
                link.download = 'VOID_LAB_김석민_대표.vcf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
                showToast('연락처 파일(.vcf)이 저장되었습니다');
            } catch (err) {
                console.error('vCard 다운로드 오류:', err);
                showToast('연락처 저장 중 오류가 발생했습니다.');
            }
        }

        // 페이지 초기화 및 인터랙션 이벤트 바인딩
        document.addEventListener('DOMContentLoaded', () => {
            // 캐시된 로고 이미지가 이미 로드된 경우에도 즉시 배경색 매칭 실행
            const logoImg = document.getElementById('logoImg');
            if (logoImg && logoImg.complete && logoImg.naturalWidth > 0) {
                syncHeaderBackground(logoImg);
            }

            // 연락처 저장 버튼
            const saveContactBtn = document.getElementById('saveContactBtn');
            if (saveContactBtn) {
                saveContactBtn.addEventListener('click', downloadVCard);
            }

            // 개별 연락처 원클릭 복사 버튼
            document.querySelectorAll('.copy-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const value = btn.getAttribute('data-copy') || '';
                    copyToClipboard(value, '복사되었습니다');
                });
            });

            // 명함 링크 복사 버튼
            const copyCardUrlBtn = document.getElementById('copyCardUrlBtn');
            if (copyCardUrlBtn) {
                copyCardUrlBtn.addEventListener('click', () => {
                    copyToClipboard(window.location.href, '명함 링크가 복사되었습니다');
                });
            }
        });
    </script>
</body>
</html>
